# AttenX Training Configuration

# Dataset
data_dir: "./data"
image_size: 256
num_workers: 4

# Model Architecture
ngf: 64  # Generator base channel count
ndf: 64  # Discriminator base channel count  
nef: 512  # Text/Image encoder feature dim
nhidden: 256  # RNN hidden size
nembed: 256  # Word embedding dim
vocab_size: 10000  # Vocabulary size

# Training Hyperparameters
epochs: 100
batch_size: 4
lr_g: 1e-4  # Generator learning rate
lr_d: 4e-4  # Discriminator learning rate
D_steps: 1  # Discriminator steps per generator step
gamma_damsm: 5.0
lambda_kl: 2.0  # DAMSM loss weight
clip_grad: null  # Gradient clipping value (optional)
seed: 42  # Random seed
use_amp: false  # Use automatic mixed precision
gpu_ids: "6,7"  # Comma-separated CUDA GPU IDs, e.g. "0,1"

# Learning Rate Scheduling
lr_patience: 5
lr_factor: 0.5

# Validation & Early Stopping
validate_interval: 1
patience_early_stop: 10
min_delta: 0.0001  # Minimum improvement threshold

# Checkpointing & Logging
checkpoint_dir: "./checkpoints"
checkpoint_interval: 10
log_dir: "./logs/training"
resume: false

# Pretrained DAMSM Encoders (optional)
damsm_text_path: null
damsm_image_path: null